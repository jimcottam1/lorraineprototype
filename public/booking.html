<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Session - Reiki Your Path to Wellness</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            // Initialize EmailJS with your public key
            emailjs.init('lgc04eJxeOiQSZHe4'); // EmailJS Public Key
        })();
    </script>
    <style>
        .booking-form-page {
            max-width: 700px;
            margin: 100px auto 50px;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .booking-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .booking-header h1 {
            color: #2c5f4f;
            margin-bottom: 10px;
        }
        .booking-header p {
            color: #666;
            font-size: 1.1rem;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group label .required {
            color: #d32f2f;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            font-family: 'Lato', sans-serif;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-group small {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 14px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
        }
        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }
        .checkbox-item label {
            margin-bottom: 0;
            font-weight: 400;
        }
        .program-price {
            display: inline-block;
            background: #f0f8f5;
            color: #2c5f4f;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 10px;
            font-size: 1.1rem;
        }
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .slot-card {
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }
        .slot-card:hover {
            border-color: #2c5f4f;
            background: #f0f8f5;
        }
        .slot-card.selected {
            border-color: #2c5f4f;
            background: #2c5f4f;
            color: white;
        }
        .slot-card.selected .slot-date {
            color: #e8f5e9;
        }
        .slot-date {
            font-weight: 600;
            color: #2c5f4f;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .slot-time {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 3px;
        }
        .slot-duration {
            font-size: 13px;
            opacity: 0.8;
        }
        .submit-btn {
            background: #2c5f4f;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background: #1e4436;
        }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2c5f4f;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        #programPrice {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="booking-form-page">
        <a href="index.html" class="back-link">← Back to Home</a>

        <div class="booking-header">
            <h1>Book Your Session</h1>
            <p>Complete this form and we'll send you a secure payment link</p>
        </div>

        <form id="bookingForm">
            <!-- Program Selection -->
            <div class="form-group">
                <label for="program">Select Program/Session <span class="required">*</span></label>
                <select id="program" name="program" required>
                    <option value="">Please select...</option>
                    <option value="experience" data-price="64">Experience Reiki - Single Session (£64)</option>
                    <option value="solo" data-price="70">Solo Follow-Up Session (£70)</option>
                    <option value="wellness" data-price="256">Path to Wellness - 4-Week Program (£256)</option>
                    <option value="weightloss" data-price="256">Weight Loss & Wellbeing - 4-Week Program (£256)</option>
                    <option value="menopause" data-price="256">Pathway Through Menopause - 4-Week Program (£256)</option>
                    <option value="reiki1" data-price="0">Reiki Level One - Consultation (Free)</option>
                    <option value="reiki2" data-price="0">Reiki Level Two - Consultation (Free)</option>
                </select>
                <div id="programPrice"></div>
            </div>

            <!-- Contact Information -->
            <div class="form-group">
                <label for="fullName">Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="07700 900000" required>
            </div>

            <!-- Scheduling Preferences -->
            <div class="form-group">
                <label>Select Available Time Slot <span class="required">*</span></label>
                <small>Choose from Lorraine's available appointment times</small>
                <div id="availableSlotsContainer" style="margin-top: 15px;">
                    <p style="text-align: center; color: #999; padding: 20px;">Loading available slots...</p>
                </div>
                <input type="hidden" id="selectedSlotId" name="selectedSlotId" required>
            </div>

            <!-- Additional Information -->
            <div class="form-group">
                <label for="notes">Additional Notes or Questions</label>
                <textarea id="notes" name="notes" placeholder="Any specific dates you prefer? Any questions for Lorraine?"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="submitBtn">Submit Booking Request</button>
        </form>
    </div>

    <script>
        let availableSlots = [];
        let selectedSlot = null;

        // API URL configuration
        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:3000/api'
            : 'https://lorraine-booking-backend.onrender.com/api';

        // Load available slots
        async function loadAvailableSlots() {
            try {
                const response = await fetch(`${API_URL}/slots/available`);
                const data = await response.json();

                if (data.success) {
                    availableSlots = data.slots;
                    displayAvailableSlots();
                } else {
                    document.getElementById('availableSlotsContainer').innerHTML =
                        '<p style="color: #d32f2f;">Unable to load available slots. Please try again later.</p>';
                }
            } catch (error) {
                console.error('Error loading slots:', error);
                document.getElementById('availableSlotsContainer').innerHTML =
                    '<p style="color: #d32f2f;">Unable to load available slots. Please contact Lorraine at 07846 633248.</p>';
            }
        }

        // Display available slots
        function displayAvailableSlots() {
            const container = document.getElementById('availableSlotsContainer');

            if (availableSlots.length === 0) {
                container.innerHTML = '<p style="color: #999;">No available slots at the moment. Please contact Lorraine at 07846 633248 to schedule.</p>';
                return;
            }

            container.innerHTML = `
                <div class="slot-grid">
                    ${availableSlots.map(slot => `
                        <div class="slot-card" onclick="selectSlot('${slot.id}')">
                            <div class="slot-date">${slot.displayDate}</div>
                            <div class="slot-time">${slot.displayTime}</div>
                            <div class="slot-duration">${slot.duration} minutes</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Select a slot
        function selectSlot(slotId) {
            selectedSlot = slotId;
            document.getElementById('selectedSlotId').value = slotId;

            // Update visual selection
            document.querySelectorAll('.slot-card').forEach(card => {
                card.classList.remove('selected');
            });
            event.target.closest('.slot-card').classList.add('selected');
        }

        // Pre-select program from URL parameter
        window.addEventListener('DOMContentLoaded', function() {
            // Load available slots
            loadAvailableSlots();

            const urlParams = new URLSearchParams(window.location.search);
            const programParam = urlParams.get('program');

            if (programParam) {
                const programSelect = document.getElementById('program');
                programSelect.value = programParam;

                // Trigger change event to show price
                programSelect.dispatchEvent(new Event('change'));
            }
        });

        // Program selection - show price
        document.getElementById('program').addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const price = selectedOption.getAttribute('data-price');
            const priceDiv = document.getElementById('programPrice');

            if (price && price !== '0') {
                priceDiv.innerHTML = `<span class="program-price">Price: £${price}</span>`;
            } else if (price === '0') {
                priceDiv.innerHTML = `<span class="program-price">Free Consultation</span>`;
            } else {
                priceDiv.innerHTML = '';
            }
        });

        // Form submission
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Validate slot is selected
            if (!selectedSlot) {
                alert('Please select an available time slot.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            // Get selected program info
            const programSelect = document.getElementById('program');
            const selectedOption = programSelect.options[programSelect.selectedIndex];
            const programText = selectedOption.text;
            const programValue = programSelect.value;
            const programPrice = selectedOption.getAttribute('data-price');

            // Prepare booking data for backend API
            const bookingData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                program: programValue,
                slotId: selectedSlot,
                notes: document.getElementById('notes').value
            };

            // Send booking to backend API
            fetch(`${API_URL}/bookings`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bookingData)
            })
                .then(response => response.json())
                .then(data => {
                    console.log('Booking created:', data);
                    console.log('Checkout URL:', data.checkoutUrl);
                    console.log('Has checkout URL?', !!data.checkoutUrl);

                    // Check if we have a Stripe checkout URL
                    if (data.checkoutUrl) {
                        // Redirect to Stripe checkout for payment
                        console.log('Redirecting to Stripe checkout:', data.checkoutUrl);
                        window.location.href = data.checkoutUrl;
                    } else {
                        // No payment required, go to confirmation page
                        // Get selected slot info
                        const slot = availableSlots.find(s => s.id === selectedSlot);

                        // Store booking ID and data for confirmation page
                        sessionStorage.setItem('bookingId', data.booking.id);
                        sessionStorage.setItem('bookingData', JSON.stringify({
                            program: programText,
                            programCode: programValue,
                            price: programPrice,
                            fullName: bookingData.fullName,
                            email: bookingData.email,
                            phone: bookingData.phone,
                            selectedSlot: slot ? `${slot.displayDate} at ${slot.displayTime}` : 'Selected',
                            notes: bookingData.notes
                        }));

                        // Redirect to confirmation page
                        window.location.href = 'booking-confirmation.html';
                    }
                })
                .catch(error => {
                    console.error('Booking error:', error);
                    alert('Sorry, there was an error submitting your booking. Please try again or call 07846 633248.');

                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Booking Request';
                });
        });
    </script>
</body>
</html>
