<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Admin - Reiki Wellness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* Login Screen */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2c5f4f 0%, #4a8070 100%);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
        }

        .login-box h1 {
            color: #2c5f4f;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #2c5f4f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover {
            background: #234a3d;
        }

        .error-message {
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        /* Admin Dashboard */
        .admin-container {
            display: none;
        }

        .header {
            background: #2c5f4f;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .dashboard {
            padding: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: #2c5f4f;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filters select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
        }

        .bookings-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f8f8;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        tr:hover {
            background: #fafafa;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3e0;
            color: #e65100;
        }

        .status-paid {
            background: #e3f2fd;
            color: #1565c0;
        }

        .status-confirmed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-completed {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .status-cancelled {
            background: #ffebee;
            color: #c62828;
        }

        .btn-small {
            padding: 6px 12px;
            background: #2c5f4f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-small:hover {
            background: #234a3d;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .modal-content {
            background: white;
            margin: 50px auto;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .detail-row {
            margin-bottom: 15px;
        }

        .detail-row label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }

        .detail-row p {
            color: #333;
        }

        .hidden {
            display: none;
        }

        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #2c5f4f;
            border-bottom-color: #2c5f4f;
        }

        .tab-btn:hover {
            color: #2c5f4f;
        }

        .time-chip {
            padding: 6px 12px;
            background: #e3f2fd;
            color: #1565c0;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .time-chip button {
            background: none;
            border: none;
            color: #1565c0;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .slot-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .slot-item:hover {
            background: #fafafa;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginContainer" class="login-container">
        <div class="login-box">
            <h1>Admin Login</h1>
            <div id="loginError" class="error-message"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autofocus>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminContainer" class="admin-container">
        <div class="header">
            <h1>📋 Booking Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="dashboard">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Bookings</h3>
                    <div class="number" id="statTotal">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pending</h3>
                    <div class="number" id="statPending">0</div>
                </div>
                <div class="stat-card">
                    <h3>Confirmed</h3>
                    <div class="number" id="statConfirmed">0</div>
                </div>
                <div class="stat-card">
                    <h3>Total Revenue</h3>
                    <div class="number" id="statRevenue">£0</div>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <div style="margin: 30px 0 20px; display: flex; gap: 10px; border-bottom: 2px solid #e0e0e0;">
                <button class="tab-btn active" onclick="showTab('bookings')">📋 Bookings</button>
                <button class="tab-btn" onclick="showTab('slots')">📅 Manage Slots</button>
            </div>

            <!-- Bookings Tab -->
            <div id="bookingsTab">
            <!-- Filters -->
            <div class="filters">
                <select id="filterStatus" onchange="loadBookings()">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="paid">Paid</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>

                <select id="filterProgram" onchange="loadBookings()">
                    <option value="">All Programs</option>
                    <option value="experience">Experience Reiki</option>
                    <option value="solo">Solo Follow-Up</option>
                    <option value="wellness">Path to Wellness</option>
                    <option value="weightloss">Weight Loss & Wellbeing</option>
                    <option value="menopause">Pathway Through Menopause</option>
                    <option value="reiki1">Reiki Level One</option>
                    <option value="reiki2">Reiki Level Two</option>
                </select>

                <button class="btn-small" onclick="loadBookings()">Refresh</button>
            </div>

            <!-- Bookings Table -->
            <div class="bookings-table">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Client</th>
                            <th>Program</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Payment</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <tr>
                            <td colspan="7" class="loading">Loading bookings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            </div>
            <!-- End Bookings Tab -->

            <!-- Slots Tab -->
            <div id="slotsTab" class="hidden">
                <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px;">
                    <h2 style="margin-bottom: 20px;">Create Time Slots</h2>

                    <!-- Quick Add Single Slot -->
                    <div style="margin-bottom: 30px; padding-bottom: 30px; border-bottom: 2px solid #f0f0f0;">
                        <h3 style="margin-bottom: 15px; font-size: 16px;">Add Single Slot</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 15px; align-items: end;">
                            <div>
                                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Date</label>
                                <input type="date" id="singleDate" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Time</label>
                                <input type="time" id="singleTime" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Duration (mins)</label>
                                <input type="number" id="singleDuration" value="60" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                            </div>
                            <button class="btn-small" onclick="createSingleSlot()" style="padding: 10px 24px;">Add Slot</button>
                        </div>
                    </div>

                    <!-- Bulk Add Slots -->
                    <div>
                        <h3 style="margin-bottom: 15px; font-size: 16px;">Add Multiple Slots (Bulk)</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div>
                                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Start Date</label>
                                <input type="date" id="bulkStartDate" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 5px; font-weight: 600;">End Date</label>
                                <input type="date" id="bulkEndDate" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                            </div>
                        </div>

                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Times (add each time)</label>
                            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                                <input type="time" id="bulkTimeInput" style="padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                                <button class="btn-small" onclick="addBulkTime()">Add Time</button>
                            </div>
                            <div id="bulkTimesList" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
                        </div>

                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Exclude Days</label>
                            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                                <label><input type="checkbox" value="Sunday" class="exclude-day"> Sunday</label>
                                <label><input type="checkbox" value="Monday" class="exclude-day"> Monday</label>
                                <label><input type="checkbox" value="Tuesday" class="exclude-day"> Tuesday</label>
                                <label><input type="checkbox" value="Wednesday" class="exclude-day"> Wednesday</label>
                                <label><input type="checkbox" value="Thursday" class="exclude-day"> Thursday</label>
                                <label><input type="checkbox" value="Friday" class="exclude-day"> Friday</label>
                                <label><input type="checkbox" value="Saturday" class="exclude-day"> Saturday</label>
                            </div>
                        </div>

                        <button class="btn-small" onclick="createBulkSlots()" style="padding: 12px 32px; font-size: 16px;">Create All Slots</button>
                    </div>
                </div>

                <!-- Slots List -->
                <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <h2 style="margin-bottom: 20px;">Available Slots</h2>
                    <div id="slotsListContainer">
                        <p style="text-align: center; color: #999; padding: 40px;">Loading slots...</p>
                    </div>
                </div>
            </div>
            <!-- End Slots Tab -->
        </div>
    </div>

    <!-- Booking Detail Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Booking Details</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div id="bookingDetails"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
